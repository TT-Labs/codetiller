name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # the factory image still builds: what it copies from the repository is listed by hand
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/factory/Dockerfile
          load: true
          tags: codetiller/factory:ci
          cache-from: type=gha,scope=factory-ci
          cache-to: type=gha,scope=factory-ci,mode=max
      - run: docker run --rm codetiller/factory:ci --version
      # the dashboard is in the image and the server finds it
      - run: |
          docker run -d --name tiller -w /tmp -p 4317:4317 codetiller/factory:ci
          for i in $(seq 20); do
            curl -fsS http://127.0.0.1:4317/ | grep -q 'assets/' && exit 0
            sleep 1
          done
          docker logs tiller
          exit 1
