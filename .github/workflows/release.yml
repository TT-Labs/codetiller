name: Release

# A tag vX.Y.Z publishes the two images (linux/amd64 and linux/arm64) as X.Y.Z, X.Y and latest,
# and a GitHub release with the install script. Started by hand it only builds: nothing is pushed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: factory
            context: .
            file: images/factory/Dockerfile
          - image: base
            context: images/base
            file: images/base/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tt-labs/codetiller-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TILLER_VERSION=${{ env.PUBLISH == 'true' && steps.meta.outputs.version || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  release:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # the script of a release installs that release
      - run: |
          version=${GITHUB_REF_NAME#v}
          sed -i "s/^version=.*/version=\${TILLER_VERSION:-$version}/" deploy/install.sh
          grep -q "^version=\${TILLER_VERSION:-$version}$" deploy/install.sh
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes deploy/install.sh deploy/compose.yaml
        env:
          GH_TOKEN: ${{ github.token }}
