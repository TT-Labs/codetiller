# tiller in one namespace of a cluster: kubectl apply -k deploy/kubernetes
# See docs/install-kubernetes.md for the secret it needs and what the cluster must provide.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tiller
resources:
  - namespace.yaml
  - rbac.yaml
  - storage.yaml
  - tiller.yaml
  - gateway.yaml
  - registry.yaml
  - network.yaml
# The factory image. Set newTag to the release you install (e.g. "0.1.0"); newName only when
# your cluster pulls from a registry of its own.
images:
  - name: codetiller/factory
    newName: ghcr.io/tt-labs/codetiller-factory
    newTag: latest
