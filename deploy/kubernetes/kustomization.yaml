# tiller in one namespace of a cluster: kubectl apply -k deploy/kubernetes
# See README "Installing on Kubernetes" for the secret it needs and what the cluster must provide.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tiller
resources:
  - namespace.yaml
  - rbac.yaml
  - storage.yaml
  - tiller.yaml
  - gateway.yaml
  - registry.yaml
  - network.yaml
# the factory image (images/factory) as your registry has it
images:
  - name: codetiller/factory
    newName: codetiller/factory
    newTag: dev
